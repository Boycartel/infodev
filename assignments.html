<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignments</title>
  </head>
  <body>
    <h1>Assignments &amp; Projects</h1>

    <nav>
      <a href="index.html">Home</a> |
      <a href="courses.html">Courses</a> |
      <a href="timetable.html">Timetable</a> |
      <a href="assignments.html">Assignments</a> |
      <a href="results.html">Results</a> |
      <a href="profile.html">Profile</a>
    </nav>

    <hr>

    <table border="1" cellpadding="8">
      <tr>
        <th>Course</th>
        <th>Task</th>
        <th>Status</th>
      </tr>
      <tr>
        <td>SWD 421</td>
        <td>Accessible website</td>
        <td>In progress</td>
      </tr>
      <tr>
        <td>SWD 423</td>
        <td>Test plan</td>
        <td>Pending</td>
      </tr>
      <tr>
        <td>SWD 429</td>
        <td>Project chapters</td>
        <td>Review</td>
      </tr>
    </table>

    <h2>Submit work</h2>
    <form action="#" method="post">
      <p>
        <label for="course">Course</label><br>
        <select id="course">
          <option>SWD 421</option>
          <option>SWD 423</option>
          <option>SWD 429</option>
        </select>
      </p>

      <p>
        <label for="file">File</label><br>
        <input id="file" type="file">
      </p>

      <p>
        <label for="note">Note</label><br>
        <textarea id="note" rows="4" cols="40"></textarea>
      </p>

      <button>Submit</button>
    </form>

    <small>Demo only: submission needs a server.</small>
  </body>
</html>
